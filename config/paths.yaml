# Configuration file for AT2_STAT6_HK2 project
# All data paths are parameterized here to ensure reproducibility

# Base directories - MODIFY THESE TO MATCH YOUR SYSTEM
project_root: "/path/to/project_root"
output_root: "/path/to/project_root/AT2_STAT6_HK2"

# Raw input data (read-only)
raw_data:
  # Working directory containing scRNA-seq data
  scRNAseq_dir: "/path/to/scRNAseq"
  seurat_all: "/path/to/scRNAseq/sce_all.rds"
  seurat_epi: "/path/to/scRNAseq/sce_epi.rds"
  seurat_ipf: "/path/to/scRNAseq/sce_ipf.rds"
  seurat_at2: "/path/to/scRNAseq/sce_at2.rds"
  seurat_ipfat2: "/path/to/scRNAseq/sce_ipfat2.rds"

  # scFEA analysis directory
  scfea_dir: "/path/to/scfea_dir"


  # Bulk RNA-seq differential expression results
  bulk_deg:
    gse134692: "/path/to/bulk/limma_notrend_results_gse134692.csv"
    gse16846: "/path/to/bulk/limma_notrend_results_gse16846.csv"
    gse32147: "/path/to/bulk/limma_notrend_results_gse32147.csv"

  # PF target genes
  pf_target_genes: "/path/to/bulk/PF_target_Hs.csv"

  # STAT6 pathway gene set
  stat6_geneset: "/path/to/scRNAseq/STAT6_geneset.csv"

  # Helper functions
  violin_plot_functions: "/path/to/scripts/Function_for_violin_plot.R"

  # scFEA module info
  scfea_module_info: "/path/to/scFEA/data/scFEA.human.moduleinfo.csv"

  # Metabolomics data
  metabolomics_raw: "/path/to/metabolomics/metab_raw.csv"
  metabolomics_sample_info: "/path/to/metabolomics/metab_sample_info.csv"

# Intermediate results (generated by scripts, can be recomputed)
processed_data:
  base_dir: "/path/to/project_root/AT2_STAT6_HK2/data/processed"
  scfea_input_at2_counts: "/path/to/project_root/AT2_STAT6_HK2/data/processed/scfea_input/at2_counts.csv"
  scfea_input_at2_metadata: "/path/to/project_root/AT2_STAT6_HK2/data/processed/scfea_input/at2_metadata.csv"
  scfea_input_ipf_counts: "/path/to/project_root/AT2_STAT6_HK2/data/processed/scfea_input/ipf_at2_counts.csv"
  scfea_input_ipf_metadata: "/path/to/project_root/AT2_STAT6_HK2/data/processed/scfea_input/ipf_at2_metadata.csv"
  scfea_flux_at2: "/path/to/project_root/AT2_STAT6_HK2/data/processed/scfea_flux_at2/adj_flux.csv"
  scfea_flux_at2_balance: "/path/to/project_root/AT2_STAT6_HK2/data/processed/scfea_flux_at2/adj_balance.csv"
  scfea_flux_ipf_at2: "/path/to/project_root/AT2_STAT6_HK2/data/processed/scfea_flux_ipf_at2/adj_flux.csv"
  scfea_flux_ipf_at2_balance: "/path/to/project_root/AT2_STAT6_HK2/data/processed/scfea_flux_ipf_at2/adj_balance.csv"

# Output figures (generated by scripts)
figures:
  base_dir: "/path/to/project_root/AT2_STAT6_HK2/figures"

# Analysis parameters
parameters:
  # Random seed for reproducibility
  seed: 123

  # Statistical thresholds (used in DEG filtering)
  stats:
    padj_cutoff: 0.05
    pval_cutoff: 0.01
    logfc_cutoff: 0.5

# Computational environment information
conda_envs:
  r_env: "r_4_3"  # R 4.3 environment for scRNA-seq analysis
  py_env: "py310" # Python 3.10 environment for scFEA
