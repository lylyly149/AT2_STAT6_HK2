# Configuration file for AT2_STAT6_HK2 project
# All data paths are parameterized here to ensure reproducibility

# Base directories - MODIFY THESE TO MATCH YOUR SYSTEM
project_root: "/mnt/d/researchproject/STAT6 and EMT"
output_root: "/mnt/d/researchproject/STAT6 and EMT/AT2_STAT6_HK2"

# Raw input data (read-only)
raw_data:
  # Working directory containing scRNA-seq data
  scRNAseq_dir: "/mnt/d/researchproject/STAT6 and EMT/scRNAseq"
  seurat_all: "/mnt/d/researchproject/STAT6 and EMT/scRNAseq/sce_all.rds"
  seurat_epi: "/mnt/d/researchproject/STAT6 and EMT/scRNAseq/sce_epi.rds"
  seurat_ipf: "/mnt/d/researchproject/STAT6 and EMT/scRNAseq/sce_ipf.rds"
  seurat_at2: "/mnt/d/researchproject/STAT6 and EMT/scRNAseq/sce_at2.rds"
  seurat_ipfat2: "/mnt/d/researchproject/STAT6 and EMT/scRNAseq/sce_ipfat2.rds"

  # scFEA analysis directory
  scfea_dir: "/mnt/d/researchproject/STAT6 and EMT/25_11_08_STAT6KO"


  # Bulk RNA-seq differential expression results
  bulk_deg:
    gse134692: "/mnt/d/researchproject/STAT6 and EMT/wd/limma_notrend_results_gse134692.csv"
    gse16846: "/mnt/d/researchproject/STAT6 and EMT/wd/limma_notrend_results_gse16846.csv"
    gse32147: "/mnt/d/researchproject/STAT6 and EMT/wd/limma_notrend_results_gse32147.csv"

  # PF target genes
  pf_target_genes: "/mnt/d/researchproject/STAT6 and EMT/wd/PF target Hs.csv"

  # STAT6 pathway gene set
  stat6_geneset: "/mnt/d/researchproject/STAT6 and EMT/scRNAseq/STAT6 geneset.csv"

  # Helper functions
  violin_plot_functions: "/mnt/d/researchproject/STAT6 and EMT/wd/assist/Function_for_violin_plot.R"

  # scFEA module info
  scfea_module_info: "/mnt/d/researchproject/STAT6 and EMT/25_11_08_STAT6KO/refcode/scFEA/data及参考文献/scFEA.human.moduleinfo.csv"

  # Metabolomics data
  metabolomics_raw: "/mnt/d/researchproject/STAT6 and EMT/25_11_08_STAT6KO/rawdata/metab_raw.csv"
  metabolomics_sample_info: "/mnt/d/researchproject/STAT6 and EMT/25_11_08_STAT6KO/rawdata/metab_sample_info.csv"

# Intermediate results (generated by scripts, can be recomputed)
processed_data:
  base_dir: "/mnt/d/researchproject/STAT6 and EMT/AT2_STAT6_HK2/data/processed"
  scfea_input_at2_counts: "/mnt/d/researchproject/STAT6 and EMT/AT2_STAT6_HK2/data/processed/scfea_input/at2_counts.csv"
  scfea_input_at2_metadata: "/mnt/d/researchproject/STAT6 and EMT/AT2_STAT6_HK2/data/processed/scfea_input/at2_metadata.csv"
  scfea_input_ipf_counts: "/mnt/d/researchproject/STAT6 and EMT/AT2_STAT6_HK2/data/processed/scfea_input/ipf_at2_counts.csv"
  scfea_input_ipf_metadata: "/mnt/d/researchproject/STAT6 and EMT/AT2_STAT6_HK2/data/processed/scfea_input/ipf_at2_metadata.csv"
  scfea_flux_at2: "/mnt/d/researchproject/STAT6 and EMT/AT2_STAT6_HK2/data/processed/scfea_flux_at2/adj_flux.csv"
  scfea_flux_at2_balance: "/mnt/d/researchproject/STAT6 and EMT/AT2_STAT6_HK2/data/processed/scfea_flux_at2/adj_balance.csv"
  scfea_flux_ipf_at2: "/mnt/d/researchproject/STAT6 and EMT/AT2_STAT6_HK2/data/processed/scfea_flux_ipf_at2/adj_flux.csv"
  scfea_flux_ipf_at2_balance: "/mnt/d/researchproject/STAT6 and EMT/AT2_STAT6_HK2/data/processed/scfea_flux_ipf_at2/adj_balance.csv"

# Output figures (generated by scripts)
figures:
  base_dir: "/mnt/d/researchproject/STAT6 and EMT/AT2_STAT6_HK2/figures"

# Analysis parameters
parameters:
  # Random seed for reproducibility
  seed: 123

  # Quality control thresholds
  qc:
    min_features: 300
    max_features: 5000
    min_counts: 1000
    max_mt_percent: 20

  # Clustering parameters
  clustering:
    n_pcs: 11
    resolution: 0.1
    n_variable_features: 2000

  # Statistical thresholds
  stats:
    padj_cutoff: 0.05
    pval_cutoff: 0.01
    logfc_cutoff: 0.5

# Computational environment information
conda_envs:
  r_env: "r_4_3"  # R 4.3 environment for scRNA-seq analysis
  py_env: "py311" # Python 3.11 environment for scFEA
